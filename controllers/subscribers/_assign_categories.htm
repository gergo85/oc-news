<div class="modal-header">
    <button type="button" class="close" data-dismiss="popup">×</button>
    <h4 class="modal-title"><?= e(trans('indikator.news::lang.button.assign_categories')) ?></h4>
</div>
<div class="modal-body">
    <?php foreach ((array) $checked as $id): ?>
    <input type="hidden" name="checked[]" value="<?= (int) $id ?>">
    <?php endforeach ?>

    <div class="form-group">
        <label class="control-label"><?= e(trans('indikator.news::lang.form.categories')) ?></label>
        <?php if ($categories->isEmpty()): ?>
        <p class="text-muted"><?= e(trans('indikator.news::lang.flash.no_categories')) ?></p>
        <?php else: ?>
        <?php foreach ($categories as $category): ?>
        <div class="checkbox">
            <label>
                <input type="checkbox" name="categories[]" value="<?= $category->id ?>">
                <?= e($category->name) ?>
            </label>
        </div>
        <?php endforeach ?>
        <?php endif ?>
    </div>

    <div class="form-group">
        <label class="control-label"><?= e(trans('indikator.news::lang.button.assign_mode')) ?></label>
        <select name="assign_mode" class="form-control custom-select">
            <option value="add"><?= e(trans('indikator.news::lang.button.assign_mode_add')) ?></option>
            <option value="replace"><?= e(trans('indikator.news::lang.button.assign_mode_replace')) ?></option>
            <option value="remove"><?= e(trans('indikator.news::lang.button.assign_mode_remove')) ?></option>
        </select>
    </div>
</div>
<div class="modal-footer">
    <button
        type="button"
        class="btn btn-primary"
        data-request="onAssignCategories"
        data-stripe-load-indicator>
        <?= e(trans('backend::lang.form.save')) ?>
    </button>
    <button type="button" class="btn btn-default" data-dismiss="popup">
        <?= e(trans('backend::lang.form.cancel')) ?>
    </button>
</div>
